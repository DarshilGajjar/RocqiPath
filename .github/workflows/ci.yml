name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libopenslide0 libvips-tools
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pytest>=7.4" "ruff>=0.4"
      - name: Verify base-only installation
        run: |
          python -m pip install -e .
          python -c "import rocqipath, rocqipath.core, rocqipath.utils; print(rocqipath.__version__)"
      - name: Verify the base-install study surface
        run: |
          python -c "from rocqipath import Study; from rocqipath.study import verify_study"
          rocqipath doctor --json > /dev/null || true
          mkdir -p /tmp/slides && : > /tmp/slides/CASE-1_he.svs && : > /tmp/slides/CASE-1_cd8.svs
          rocqipath study --home /tmp/rocqipath init smoke --source /tmp/slides
          rocqipath study --home /tmp/rocqipath index smoke
          rocqipath study --home /tmp/rocqipath verify smoke
          rocqipath study --home /tmp/rocqipath plan smoke
          rocqipath study --home /tmp/rocqipath run smoke --dry-run
      - name: Verify package metadata and console entry point
        run: |
          python -c "from importlib.metadata import version; import rocqipath; assert rocqipath.__version__ == version('rocqipath')"
          python -c "from importlib.metadata import distribution; ep = next(item for item in distribution('rocqipath').entry_points if item.name == 'rocqipath'); assert ep.value == 'rocqipath.cli:main'; assert callable(ep.load())"
      - run: python -m pip install -e ".[orb,cellcount,viz]"
      - run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - run: python -m compileall -q src tests
      - run: python -m pytest
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
