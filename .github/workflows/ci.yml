name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and linter
        run: python -m pip install -e . ruff

      - name: Lint
        run: ruff check --select E4,E7,E9,F src tests

      - name: Check imports and CLI
        run: |
          python -c "import rocqipath; print(rocqipath.__version__)"
          rocqipath --help
          rocqipath align --help
          rocqipath compare --help
          rocqipath count --help
          rocqipath extract --help
          rocqipath stain --help
