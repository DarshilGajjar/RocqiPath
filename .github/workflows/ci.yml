name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel older runs when another commit is pushed to the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Lightweight smoke test
    runs-on: ubuntu-latest

    # Do not mark the overall workflow as failed if this job has a problem.
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system libraries
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenslide0 libvips-tools

      - name: Install base package
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check package import
        if: always()
        continue-on-error: true
        run: |
          python -c "
          import rocqipath
          import rocqipath.core
          import rocqipath.utils

          print('RocqiPath imported successfully')
          print('Version:', rocqipath.__version__)
          "

      - name: Check package metadata
        if: always()
        continue-on-error: true
        run: |
          python -c "
          from importlib.metadata import distribution, version
          import rocqipath

          installed_version = version('rocqipath')
          print('Installed version:', installed_version)

          assert rocqipath.__version__ == installed_version

          entry_points = distribution('rocqipath').entry_points
          cli = next(
              (item for item in entry_points if item.name == 'rocqipath'),
              None,
          )

          if cli is not None:
              print('CLI entry point:', cli.value)
          else:
              print('Warning: rocqipath CLI entry point was not found')
          "

      - name: Complete CI
        if: always()
        run: echo "Lightweight CI completed."