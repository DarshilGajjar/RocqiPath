name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Check imports and CLI
        run: |
          python -c "import rocqipath as rp; print(rp.__version__); print([w.name for w in rp.list_workflows()])"
          rocqipath --help
          rocqipath list
          for command in $(python -c "import rocqipath as rp; print(' '.join(w.cli_name for w in rp.list_workflows()))"); do
            rocqipath "$command" --help > /dev/null
          done

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run regression suite
        run: python -m pytest

      - name: Lint source and tests
        run: ruff check src tests

      - name: Build documentation
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install -e ".[docs]"
          mkdocs build --strict

  studio-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio-web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
