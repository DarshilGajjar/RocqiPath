name: Documentation problem
description: Something in the docs is wrong, missing, or misleading.
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Which page
      placeholder: "docs/reference/study-toml.md, section [[sources]]"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - Wrong — the docs say something that is not true
        - Missing — something is undocumented
        - Unclear — technically correct but hard to follow
        - Stale — describes older behaviour
        - Broken link or example that does not run
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Details
      description: What the docs say, what is actually the case, and what you expected to find.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional, and very welcome.
