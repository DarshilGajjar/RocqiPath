name: Bug report
description: Report incorrect RocqiPath behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include patient data, identifiers, or identifying filenames.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can it be reproduced?
      description: Include the command or Python code you ran with sensitive paths redacted.
      render: shell
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Paste the traceback or error message with sensitive paths redacted.
      render: text

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, Python version, and RocqiPath version.
      placeholder: Windows 11, Python 3.11, RocqiPath 1.0.0
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - alignment
        - comparison and visualization
        - cell counting
        - extraction
        - stain normalization
        - CLI or installation
        - not sure
    validations:
      required: true
