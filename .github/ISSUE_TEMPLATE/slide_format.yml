name: Slide format or scanner support
description: A scanner or file format that RocqiPath reads incorrectly, or not at all.
labels: ["slide-format", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Format problems usually come down to metadata: an objective-power tag
        under an unexpected key, an unusual pyramid layout, or a vendor field
        RocqiPath does not yet read.

        **Never attach the slide itself, or any identifier.** Metadata keys
        and values are what help — with identifying values redacted.

  - type: checkboxes
    id: data-safety
    attributes:
      label: Data safety
      options:
        - label: This report contains no patient data, identifiers, or identifying filenames.
          required: true

  - type: input
    id: vendor
    attributes:
      label: Scanner vendor and model
      placeholder: "Hamamatsu NanoZoomer S360"
    validations:
      required: true

  - type: input
    id: format
    attributes:
      label: File format
      placeholder: ".ndpi"
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: What goes wrong
      options:
        - RocqiPath cannot open the file at all
        - Opens, but reports no objective magnification
        - Reports the wrong magnification
        - Pyramid levels resolve to an unexpected zoom
        - Reads, but output is corrupted or misaligned
        - Something else
    validations:
      required: true

  - type: textarea
    id: survey
    attributes:
      label: Survey record for one affected slide
      description: >-
        From `survey/slides/<slide_uid>.json`. Redact any identifying value.
      render: json
    validations:
      required: true

  - type: textarea
    id: properties
    attributes:
      label: Slide metadata keys
      description: >-
        `python -c "import openslide,sys; print(dict(openslide.OpenSlide(sys.argv[1]).properties))" SLIDE`
        — redact identifying values, keep the keys.
      render: text

  - type: input
    id: expected
    attributes:
      label: Correct level-0 objective magnification
      description: What the slide actually is, per the scanner.
      placeholder: "40"
