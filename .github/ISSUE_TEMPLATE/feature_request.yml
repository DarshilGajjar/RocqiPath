name: Feature request
description: Suggest a practical pathology-image analysis improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and where RocqiPath gets in the way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Describe the API, CLI behavior, or output you would find useful.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What do you do today?
      description: Note any manual steps or other tools you currently use.
